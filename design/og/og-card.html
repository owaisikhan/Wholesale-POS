<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sohana POS preview, card version</title>
<style>
  /* Variant B: the client's own visiting card as the hero, memo beside it. */
  @font-face { font-family: Plex; font-weight: 600; src: url(../../assets/fonts/plex-sans-600.ttf); }
  @font-face { font-family: Plex; font-weight: 700; src: url(../../assets/fonts/plex-sans-700.ttf); }
  :root { --navy: #1B2A4A; --turmeric: #E3A21A; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: var(--navy); font-family: Plex, sans-serif; color: #fff; overflow: hidden; position: relative; }
  .card { position: absolute; left: 56px; top: 92px; width: 640px; border-radius: 14px; overflow: hidden; box-shadow: 0 20px 44px rgba(0,0,0,.4); transform: rotate(-2deg); }
  .card img { width: 100%; display: block; }
  .chip { position: absolute; left: 56px; top: 28px; background: var(--turmeric); color: var(--navy); font-weight: 700; font-size: 26px; padding: 8px 18px; border-radius: 10px; }
  .line { position: absolute; left: 60px; bottom: 34px; width: 660px; font-size: 30px; font-weight: 700; line-height: 1.3; }
  .line span { color: #F3D58C; }
  .memo { position: absolute; right: 64px; top: 36px; width: 360px; height: 640px; transform: rotate(3deg); box-shadow: 0 24px 50px rgba(0,0,0,.35); border-radius: 6px; overflow: hidden; background: #fff; }
  .memo img { width: 100%; display: block; }
</style>
</head>
<body>
  <div class="chip">Aap ka billing app (Demo)</div>
  <div class="card"><img src="card.jpg" alt=""></div>
  <div class="line">Bill, khata, stock, cash <span>| memo on WhatsApp</span></div>
  <div class="memo"><img src="../memo/out/memo-en-whatsapp.png" alt=""></div>
</body>
</html>
