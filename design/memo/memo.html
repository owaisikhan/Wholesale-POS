<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sohana Traders Memo</title>
<style>
  /* Fonts are bundled so the memo renders the same offline. Nastaliq is a variable font (400 to 700). */
  @font-face { font-family: "IBM Plex Sans Condensed"; font-weight: 400; src: url(fonts/plex-400.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Sans Condensed"; font-weight: 500; src: url(fonts/plex-500.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Sans Condensed"; font-weight: 700; src: url(fonts/plex-700.woff2) format("woff2"); }
  @font-face { font-family: "Noto Nastaliq Urdu"; font-weight: 400 700; src: url(fonts/nastaliq-arabic.woff2) format("woff2"); }
  /*
    58mm thermal memo. The MPT-II prints 48mm wide = 384 dots at 203 dpi,
    so the memo is drawn 384 CSS px wide and printed as a bitmap. Printing
    an image (not text) is what lets Urdu come out right on a printer that
    has no Urdu font. Pure black on white only: thermal paper has no grey.
  */
  :root {
    --ink: #000;
    --paper: #fff;
    --page: #e9e6df;
    --en: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
    --ur: "Noto Nastaliq Urdu", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--page); font-family: var(--en); color: var(--ink); padding: 16px; }
  button:not(:disabled) { cursor: pointer; }

  .switch { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
  .switch button {
    min-height: 48px; min-width: 110px; padding: 0 16px; border: 2px solid var(--ink);
    background: var(--paper); font: 700 16px var(--en); border-radius: 8px;
  }
  .switch button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .switch button.ur { font-family: var(--ur); font-size: 15px; }

  .memo {
    width: 384px; margin: 0 auto; background: var(--paper);
    padding: 14px 12px 18px; font-size: 15px; line-height: 1.35;
    font-variant-numeric: tabular-nums;
  }
  .memo[dir="rtl"] { font-family: var(--ur); font-size: 15px; font-weight: 500; line-height: 2.05; }
  /* Digits stay Latin in the Urdu memo, as on every bill in Pakistani markets. */
  .memo[dir="rtl"] .num { font-family: var(--en); font-size: 15px; line-height: 1.35; }

  .center { text-align: center; }
  .shop { font-size: 26px; font-weight: 700; letter-spacing: 1px; line-height: 1.1; }
  .memo[dir="rtl"] .shop { font-size: 26px; letter-spacing: 0; line-height: 2; }
  .sub { font-size: 14px; }
  .tag { font-size: 13px; margin-top: 2px; }
  .title {
    margin: 8px 0 6px; padding: 3px 0; background: var(--ink); color: var(--paper);
    font-weight: 700; text-align: center; font-size: 16px; letter-spacing: 2px;
  }
  .memo[dir="rtl"] .title { letter-spacing: 0; padding: 0; }

  .rule { border-top: 2px dashed var(--ink); margin: 6px 0; }
  .rule.solid { border-top-style: solid; }

  .kv { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .kv b { font-weight: 700; }

  table { width: 100%; border-collapse: collapse; }
  th { font-weight: 700; font-size: 14px; padding-bottom: 2px; border-bottom: 2px solid var(--ink); }
  td { vertical-align: middle; padding: 4px 0 2px; }
  tbody tr + tr td { border-top: 1px dotted var(--ink); }
  .c-item { text-align: start; }
  .c-qty, .c-rate, .c-amt { text-align: end; white-space: nowrap; }
  .c-qty { width: 62px; } .c-rate { width: 62px; } .c-amt { width: 72px; }
  .unit { display: block; font-size: 12px; }
  .memo[dir="rtl"] .unit { font-size: 12px; line-height: 1.6; }
  .item-name { font-weight: 500; }
  .memo[dir="rtl"] .item-name { font-weight: 600; }

  .totals .kv { padding: 1px 0; }
  .grand {
    display: flex; justify-content: space-between; align-items: center;
    border: 2px solid var(--ink); padding: 4px 8px; margin: 6px 0; font-size: 19px; font-weight: 700;
  }
  .grand .num { font-size: 20px; }
  .due { font-size: 17px; font-weight: 700; }

  .thanks { font-weight: 700; font-size: 16px; margin-top: 8px; }
  .powered { font-size: 11px; margin-top: 6px; font-family: var(--en); line-height: 1.3; }
</style>
</head>
<body>
  <div class="switch" role="group" aria-label="Memo language">
    <button type="button" data-lang="en" aria-pressed="true">English</button>
    <button type="button" data-lang="ur" class="ur" aria-pressed="false">اردو</button>
  </div>
  <div id="memo" class="memo"></div>

<script>
  // Sample data. Items and the customer are placeholders; the client adds his own in the app.
  const shop = {
    en: { name: "SOHANA TRADERS", city: "Sukkur", owner: "Sunil Kumar", tag: "Wholesale rates" },
    ur: { name: "سوھان ٹریڈرس", city: "سکھر", owner: "سنیل کمار", tag: "ہول سیل ریٹ پر دستیاب" },
    phone: "0331-3151751",
  };
  const bill = {
    no: "0148", date: "01-10-2026", time: "11:42 AM",
    customer: { en: "Bismillah Kiryana Store", ur: "بسم اللہ کریانہ اسٹور", phone: "0300-1234567" },
    items: [
      { en: "Washing Powder 1kg", ur: "واشنگ پاؤڈر 1 کلو", qty: 3, unit: { en: "Ctn (20 pc)", ur: "کارٹن (20 پیس)" }, rate: 2350 },
      { en: "Washing Tel 1L",     ur: "واشنگ تیل 1 لیٹر",  qty: 12, unit: { en: "Bottle", ur: "بوتل" }, rate: 180 },
      { en: "Soda 25kg",          ur: "سوڈا 25 کلو",       qty: 1, unit: { en: "Bori", ur: "بوری" }, rate: 2750 },
      { en: "Amchoor",            ur: "آمچور",             qty: 2, unit: { en: "Kg", ur: "کلو" }, rate: 650 },
      { en: "Garam Masala",       ur: "گرم مصالحہ",         qty: 1, unit: { en: "Kg", ur: "کلو" }, rate: 1400 },
    ],
    discount: 160,
    previous: 8200,
    received: 10000,
  };

  const L = {
    en: { memo: "CASH MEMO", billNo: "Bill #", date: "Date", time: "Time", customer: "Customer", phone: "Phone",
          item: "Item", qty: "Qty", rate: "Rate", amt: "Amount", subtotal: "Subtotal", discount: "Discount",
          bill: "Bill Total", previous: "Previous Balance", total: "Total Due", received: "Received",
          balance: "Remaining Balance", items: "Items", thanks: "Thank you! Please visit again." },
    ur: { memo: "کیش میمو", billNo: "بل نمبر", date: "تاریخ", time: "وقت", customer: "گاہک", phone: "فون",
          item: "آئٹم", qty: "تعداد", rate: "ریٹ", amt: "رقم", subtotal: "کل رقم", discount: "رعایت",
          bill: "بل کی رقم", previous: "پچھلا بقایا", total: "کل واجب الادا", received: "وصول",
          balance: "باقی بقایا", items: "آئٹمز", thanks: "شکریہ! دوبارہ تشریف لائیں" },
  };

  const rs = (n) => n.toLocaleString("en-PK");
  const num = (v) => `<span class="num" dir="ltr">${v}</span>`;
  const kv = (k, v, cls = "") => `<div class="kv ${cls}"><span>${k}</span>${v}</div>`;

  function render(lang) {
    const t = L[lang], s = shop[lang];
    const subtotal = bill.items.reduce((a, i) => a + i.qty * i.rate, 0);
    const net = subtotal - bill.discount;
    const due = net + bill.previous;
    const left = due - bill.received;

    const rows = bill.items.map((i) => `
      <tr>
        <td class="c-item"><span class="item-name">${i[lang]}</span></td>
        <td class="c-qty">${num(i.qty)}<span class="unit">${i.unit[lang]}</span></td>
        <td class="c-rate">${num(rs(i.rate))}</td>
        <td class="c-amt">${num(rs(i.qty * i.rate))}</td>
      </tr>`).join("");

    const memo = document.getElementById("memo");
    memo.dir = lang === "ur" ? "rtl" : "ltr";
    memo.lang = lang;
    memo.innerHTML = `
      <div class="center">
        <div class="shop">${s.name}</div>
        <div class="sub">${s.city} &nbsp;|&nbsp; ${s.owner} ${num(shop.phone)}</div>
        <div class="tag">${s.tag}</div>
      </div>
      <div class="title">${t.memo}</div>
      ${kv(`${t.billNo}`, `<b>${num(bill.no)}</b>`)}
      ${kv(t.date, num(`${bill.date} &nbsp; ${bill.time}`))}
      <div class="rule"></div>
      ${kv(t.customer, `<b>${bill.customer[lang]}</b>`)}
      ${kv(t.phone, num(bill.customer.phone))}
      <div class="rule"></div>
      <table>
        <thead><tr>
          <th class="c-item">${t.item}</th><th class="c-qty">${t.qty}</th>
          <th class="c-rate">${t.rate}</th><th class="c-amt">${t.amt}</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="rule solid"></div>
      <div class="totals">
        ${kv(`${t.items}: ${num(bill.items.length)}`, "")}
        ${kv(t.subtotal, num(rs(subtotal)))}
        ${kv(t.discount, num("- " + rs(bill.discount)))}
        <div class="grand"><span>${t.bill}</span>${num("Rs " + rs(net))}</div>
        ${kv(t.previous, num(rs(bill.previous)))}
        ${kv(t.total, `<b>${num(rs(due))}</b>`)}
        ${kv(t.received, num(rs(bill.received)))}
        <div class="rule"></div>
        ${kv(t.balance, num("Rs " + rs(left)), "due")}
      </div>
      <div class="rule"></div>
      <div class="center thanks">${t.thanks}</div>
      <div class="center powered">Software by Kodexa | kodexa.store</div>
    `;
    document.querySelectorAll(".switch button").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  }

  document.querySelectorAll(".switch button").forEach((b) =>
    b.addEventListener("click", () => render(b.dataset.lang)));
  const start = new URLSearchParams(location.search).get("lang");
  render(start === "ur" ? "ur" : "en");
</script>
</body>
</html>
